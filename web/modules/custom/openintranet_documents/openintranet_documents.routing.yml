# Browser main page
openintranet_documents.browser:
  path: '/documents'
  defaults:
    _controller: '\Drupal\openintranet_documents\Controller\DocumentBrowserController::browse'
    _title: 'Documents'
  requirements:
    _permission: 'view oi_document'

# Search documents and folders
openintranet_documents.search:
  path: '/documents/search'
  defaults:
    _controller: '\Drupal\openintranet_documents\Controller\SearchController::search'
    _title: 'Search Documents'
  requirements:
    _permission: 'view oi_document'
  options:
    _admin_route: FALSE

# View folder contents
openintranet_documents.folder.view:
  path: '/documents/folder/{oi_folder}'
  defaults:
    _controller: '\Drupal\openintranet_documents\Controller\FolderController::view'
    _title_callback: '\Drupal\openintranet_documents\Controller\FolderController::title'
  requirements:
    _permission: 'view oi_folder'
  options:
    parameters:
      oi_folder:
        type: entity:oi_folder

# Override entity add form to use frontend theme
entity.oi_folder.add_form:
  path: '/documents/folder/add'
  defaults:
    _entity_form: 'oi_folder.add'
    _title: 'Add folder'
  requirements:
    _permission: 'create oi_folder'
  options:
    _admin_route: FALSE

# Modal form for adding folder (root level)
entity.oi_folder.add_modal:
  path: '/documents/folder/add-modal'
  defaults:
    _entity_form: 'oi_folder.add_modal'
    _title: 'Add folder'
  requirements:
    _permission: 'create oi_folder'
  options:
    _admin_route: FALSE

# Add subfolder in folder
entity.oi_folder.add_form_in_folder:
  path: '/documents/folder/{parent}/add-subfolder'
  defaults:
    _entity_form: 'oi_folder.add'
    _title: 'Add subfolder'
  requirements:
    _permission: 'create oi_folder'
  options:
    _admin_route: FALSE
    parameters:
      parent:
        type: entity:oi_folder

# Modal form for adding subfolder
entity.oi_folder.add_modal_in_folder:
  path: '/documents/folder/{parent}/add-subfolder-modal'
  defaults:
    _entity_form: 'oi_folder.add_modal'
    _title: 'Add subfolder'
  requirements:
    _permission: 'create oi_folder'
  options:
    _admin_route: FALSE
    parameters:
      parent:
        type: entity:oi_folder

# Override entity edit form to use frontend theme
entity.oi_folder.edit_form:
  path: '/documents/folder/{oi_folder}/edit'
  defaults:
    _entity_form: 'oi_folder.edit'
    _title: 'Edit folder'
  requirements:
    _permission: 'edit oi_folder'
  options:
    _admin_route: FALSE
    parameters:
      oi_folder:
        type: entity:oi_folder

# Override entity delete form to use frontend theme
entity.oi_folder.delete_form:
  path: '/documents/folder/{oi_folder}/delete'
  defaults:
    _entity_form: 'oi_folder.delete'
    _title: 'Delete folder'
  requirements:
    _permission: 'delete oi_folder'
  options:
    _admin_route: FALSE
    parameters:
      oi_folder:
        type: entity:oi_folder

# Override document add form to use frontend theme
entity.oi_document.add_form:
  path: '/documents/add'
  defaults:
    _entity_form: 'oi_document.add'
    _title: 'Upload document'
  requirements:
    _permission: 'create oi_document'
  options:
    _admin_route: FALSE

# Modal form for adding document (root level)
entity.oi_document.add_modal:
  path: '/documents/add-modal'
  defaults:
    _entity_form: 'oi_document.add_modal'
    _title: 'Upload document'
  requirements:
    _permission: 'create oi_document'
  options:
    _admin_route: FALSE

# Add document in folder
entity.oi_document.add_form_in_folder:
  path: '/documents/folder/{folder}/add-document'
  defaults:
    _entity_form: 'oi_document.add'
    _title: 'Upload document'
  requirements:
    _permission: 'create oi_document'
  options:
    _admin_route: FALSE
    parameters:
      folder:
        type: entity:oi_folder

# Modal form for adding document in folder
entity.oi_document.add_modal_in_folder:
  path: '/documents/folder/{folder}/add-document-modal'
  defaults:
    _entity_form: 'oi_document.add_modal'
    _title: 'Upload document'
  requirements:
    _permission: 'create oi_document'
  options:
    _admin_route: FALSE
    parameters:
      folder:
        type: entity:oi_folder

# Override document edit form to use frontend theme
entity.oi_document.edit_form:
  path: '/documents/document/{oi_document}/edit'
  defaults:
    _entity_form: 'oi_document.edit'
    _title: 'Edit document'
  requirements:
    _permission: 'edit oi_document'
  options:
    _admin_route: FALSE
    parameters:
      oi_document:
        type: entity:oi_document

# Override document delete form to use frontend theme
entity.oi_document.delete_form:
  path: '/documents/document/{oi_document}/delete'
  defaults:
    _entity_form: 'oi_document.delete'
    _title: 'Delete document'
  requirements:
    _permission: 'delete oi_document'
  options:
    _admin_route: FALSE
    parameters:
      oi_document:
        type: entity:oi_document

# View document
entity.oi_document.canonical:
  path: '/documents/document/{oi_document}'
  defaults:
    _controller: '\Drupal\openintranet_documents\Controller\OiDocumentController::view'
    _title_callback: '\Drupal\openintranet_documents\Controller\OiDocumentController::title'
  requirements:
    _permission: 'view oi_document'
  options:
    _admin_route: FALSE
    parameters:
      oi_document:
        type: entity:oi_document

# Download document
openintranet_documents.download:
  path: '/documents/document/{oi_document}/download'
  defaults:
    _controller: '\Drupal\openintranet_documents\Controller\DocumentBrowserController::download'
  requirements:
    _permission: 'download oi_document'
  options:
    parameters:
      oi_document:
        type: entity:oi_document
