langcode: en
status: true
dependencies:
  config:
    - field.storage.node.body
    - field.storage.node.field_forum_category
    - field.storage.node.field_forum_tags
    - field.storage.user.field_department
    - field.storage.user.field_office
    - node.type.forum_post
    - search_api.server.db_server
    - taxonomy.vocabulary.department
    - taxonomy.vocabulary.forum_category
    - taxonomy.vocabulary.forum_tag
    - taxonomy.vocabulary.office
  module:
    - node
    - search_api
    - user
id: forum_index
name: 'Forum search'
description: 'Search index for forum posts (optional; requires Search API DB server).'
read_only: false
field_settings:
  author:
    label: 'Authored by'
    datasource_id: 'entity:node'
    property_path: uid
    type: integer
    dependencies:
      module:
        - node
        - user
  author_department:
    label: 'Author department'
    datasource_id: 'entity:node'
    property_path: 'uid:entity:field_department'
    type: integer
    dependencies:
      config:
        - field.storage.user.field_department
        - taxonomy.vocabulary.department
      module:
        - node
        - taxonomy
        - user
  author_office:
    label: 'Author office'
    datasource_id: 'entity:node'
    property_path: 'uid:entity:field_office'
    type: integer
    dependencies:
      config:
        - field.storage.user.field_office
        - taxonomy.vocabulary.office
      module:
        - node
        - taxonomy
        - user
  field_forum_category:
    label: Category
    datasource_id: 'entity:node'
    property_path: field_forum_category
    type: integer
    dependencies:
      config:
        - field.storage.node.field_forum_category
        - taxonomy.vocabulary.forum_category
      module:
        - node
        - taxonomy
  field_forum_tags:
    label: Topic
    datasource_id: 'entity:node'
    property_path: field_forum_tags
    type: integer
    dependencies:
      config:
        - field.storage.node.field_forum_tags
        - taxonomy.vocabulary.forum_tag
      module:
        - node
        - taxonomy
  aggregated_field:
    label: 'Aggregated field'
    property_path: aggregated_field
    type: text
    configuration:
      type: concat
      separator: |+





      fields:
        - 'entity:node/body'
        - 'entity:node/title'
  created:
    label: 'Authored on'
    datasource_id: 'entity:node'
    property_path: created
    type: date
    dependencies:
      module:
        - node
  node_grants:
    label: 'Node access information'
    property_path: search_api_node_grants
    type: string
    indexed_locked: true
    type_locked: true
    hidden: true
  rendered_item:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: text
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:node':
          forum_post: teaser
  status:
    label: Published
    datasource_id: 'entity:node'
    property_path: status
    type: boolean
    dependencies:
      module:
        - node
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: string
    dependencies:
      module:
        - node
  type:
    label: 'Content type'
    datasource_id: 'entity:node'
    property_path: type
    type: string
    dependencies:
      module:
        - node
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - forum_post
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  content_access:
    weights:
      preprocess_query: -30
  entity_status: {  }
  entity_type: {  }
  highlight:
    weights:
      postprocess_query: 0
    prefix: '<strong>'
    suffix: '</strong>'
    excerpt: true
    excerpt_always: false
    excerpt_length: 256
    exclude_fields:
      - aggregated_field
      - rendered_item
    highlight: always
    highlight_partial: true
  html_filter:
    weights:
      preprocess_index: -15
      preprocess_query: -15
    all_fields: false
    fields:
      - aggregated_field
      - rendered_item
    title: true
    alt: true
    tags:
      h1: 5
      h2: 3
      h3: 2
      string: 2
      b: 2
  ignorecase:
    weights:
      preprocess_index: -20
      preprocess_query: -20
    all_fields: false
    fields:
      - aggregated_field
      - rendered_item
      - title
  language_with_fallback: {  }
  rendered_item: {  }
  tokenizer:
    weights:
      preprocess_index: -6
      preprocess_query: -6
    all_fields: false
    fields:
      - aggregated_field
      - rendered_item
    spaces: ''
    ignored: ._-
    overlap_cjk: 1
    minimum_word_size: '3'
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  delete_on_fail: true
  index_directly: true
  track_changes_in_references: true
server: db_server
