services:
  plugin.manager.notification_channel:
    class: Drupal\openintranet_notifications\Channel\ChannelPluginManager
    parent: default_plugin_manager

  logger.channel.openintranet_notifications:
    parent: logger.channel_base
    arguments:
      - 'openintranet_notifications'

  openintranet_notifications.preference_resolver:
    class: Drupal\openintranet_notifications\Service\PreferenceResolver
    autowire: true
  Drupal\openintranet_notifications\Service\PreferenceResolverInterface: '@openintranet_notifications.preference_resolver'
