services:
  plugin.manager.notification_channel:
    class: Drupal\openintranet_notifications\Channel\ChannelPluginManager
    parent: default_plugin_manager

  plugin.manager.notification_recipient_resolver:
    class: Drupal\openintranet_notifications\Resolver\RecipientResolverManager
    parent: default_plugin_manager

  plugin.manager.notification_delivery_policy:
    class: Drupal\openintranet_notifications\Policy\DeliveryPolicyManager
    parent: default_plugin_manager

  plugin.manager.notification_template_renderer:
    class: Drupal\openintranet_notifications\Renderer\TemplateRendererManager
    parent: default_plugin_manager

  logger.channel.openintranet_notifications:
    parent: logger.channel_base
    arguments:
      - 'openintranet_notifications'

  openintranet_notifications.preference_resolver:
    class: Drupal\openintranet_notifications\Service\PreferenceResolver
    autowire: true
  Drupal\openintranet_notifications\Service\PreferenceResolverInterface: '@openintranet_notifications.preference_resolver'

  openintranet_notifications.deduplicator:
    class: Drupal\openintranet_notifications\Service\Deduplicator
    arguments:
      - '@keyvalue.expirable'
      - '@datetime.time'

  openintranet_notifications.rate_limiter:
    class: Drupal\openintranet_notifications\Service\RateLimiter
    arguments:
      - '@keyvalue.expirable'
      - '@datetime.time'

  openintranet_notifications.audit_logger:
    class: Drupal\openintranet_notifications\Service\AuditLogger
    arguments:
      - '@logger.channel.openintranet_notifications'
