langcode: en
status: true
dependencies: {  }
id: new_comment
label: 'New comment'
description: 'Notifies the author of the commented content that a new comment was posted.'
category: social
default_priority: normal
default_channels:
  - inbox
  - email_core
forced_channels: {  }
# The comment model passes the commented node under the "commented_entity" key
# in the resolver context; entity_author then targets that node's owner.
recipient_resolvers:
  - id: entity_author
    configuration:
      entity_key: commented_entity
template_map: {  }
template_renderer: token_text
subject_template: 'New comment on "[node:title]"'
body_template: "[comment:author:name] commented on \"[node:title]\".\n\n[node:url]"
summary_template: 'New comment on "[node:title]"'
delivery_policy: user_preferences
dedupe_window: 600
user_can_override: true
audit_retention_days: 90
enabled: true
