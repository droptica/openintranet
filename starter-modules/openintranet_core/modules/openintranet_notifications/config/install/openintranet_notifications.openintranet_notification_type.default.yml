langcode: en
status: true
dependencies: {  }
id: default
label: 'General updates'
description: 'Other important updates that do not fit a more specific notification type.'
category: general
default_priority: normal
default_channels:
  - inbox
  - email_core
forced_channels:
  - inbox
recipient_resolvers: {  }
template_map: {  }
template_renderer: token_text
# Ad-hoc pass-through: the source already sets the subject/body on the
# notification, so the templates simply echo them via the [notification:*]
# tokens. summary_template is intentionally empty (no separate summary).
subject_template: '[notification:subject]'
body_template: '[notification:body]'
summary_template: ''
delivery_policy: user_preferences
dedupe_window: 600
rate_limit: 0
rate_limit_window: 3600
user_can_override: true
audit_retention_days: 90
