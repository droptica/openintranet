# Group members management (not auto-generated by entity)
openintranet_access.group_members:
  path: '/admin/openintranet/oi-groups/{oi_group}/members'
  defaults:
    _form: '\Drupal\openintranet_access\Form\OiGroupMembersForm'
    _title: 'Manage members'
  requirements:
    _permission: 'manage group members'
  options:
    parameters:
      oi_group:
        type: entity:oi_group

# Settings
openintranet_access.settings:
  path: '/admin/openintranet/access/settings'
  defaults:
    _form: '\Drupal\openintranet_access\Form\OiAccessSettingsForm'
    _title: 'Open Intranet Access settings'
  requirements:
    _permission: 'administer openintranet access'

# Node access form
openintranet_access.node_access_form:
  path: '/node/{node}/openintranet-access'
  defaults:
    _form: '\Drupal\openintranet_access\Form\EntityAccessForm'
    _title: 'Access'
  requirements:
    _permission: 'set entity access'
    _custom_access: 'openintranet_access.entity_access_check::access'
  options:
    parameters:
      node:
        type: entity:node

# Document access form
openintranet_access.document_access_form:
  path: '/documents/document/{oi_document}/access'
  defaults:
    _form: '\Drupal\openintranet_access\Form\EntityAccessForm'
    _title: 'Access'
  requirements:
    _permission: 'set entity access'
  options:
    parameters:
      oi_document:
        type: entity:oi_document

# Folder access form
openintranet_access.folder_access_form:
  path: '/documents/folder/{oi_folder}/access'
  defaults:
    _form: '\Drupal\openintranet_access\Form\EntityAccessForm'
    _title: 'Access'
  requirements:
    _permission: 'set entity access'
  options:
    parameters:
      oi_folder:
        type: entity:oi_folder

# User access info page
openintranet_access.user_access:
  path: '/user/{user}/openintranet-access'
  defaults:
    _controller: '\Drupal\openintranet_access\Controller\UserAccessController::userAccess'
    _title_callback: '\Drupal\openintranet_access\Controller\UserAccessController::title'
  requirements:
    _permission: 'administer users'
  options:
    parameters:
      user:
        type: entity:user
