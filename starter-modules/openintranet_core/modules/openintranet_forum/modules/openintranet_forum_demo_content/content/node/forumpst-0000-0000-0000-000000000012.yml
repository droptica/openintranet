      value: "<p>I just wrapped my first month and wanted to jot down what would have made the first two weeks smoother, while it is still fresh in my head.</p><p>Things like a single checklist with every account I need, a who-to-ask map per topic, and a short video tour of the intranet would have saved a lot of DMs.</p><p>If HR or People Ops is reading — happy to help shape a better onboarding handbook.</p>"
