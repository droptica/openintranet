      value: "<p>Hi everyone, and welcome to our brand new company forum! This is the place to ask questions, share ideas, and get to know colleagues across teams and offices.</p><p>Please take a minute to introduce yourself in the replies below — team, role, and one thing you are working on this week.</p><p>A few house rules: keep it respectful, use categories and tags so posts are easy to find, and prefer the forum over DMs for topics that others might benefit from.</p><p>Looking forward to seeing the discussions that come out of this.</p>"
