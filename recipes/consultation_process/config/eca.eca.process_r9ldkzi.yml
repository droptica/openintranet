langcode: en
status: true
dependencies:
  config:
    - node.type.consultation_review
  module:
    - eca_content
    - modeler_api
    - openintranet_notifications
# Blob-free, hand-authored model: ECA executes from the arrays below. The
# modeler_api stanza carries only label/version with storage:none (no "data"
# hash) so it cannot desync in BPMN.iO.
third_party_settings:
  modeler_api:
    modeler_id: bpmn_io
    storage: none
    label: 'Send email on new review'
    version: '1.0'
id: process_r9ldkzi
weight: 0
template: false
events:
  content_entity__insert_1_1:
    plugin: 'content_entity:insert'
    label: 'Insert content entity'
    configuration:
      type: 'node consultation_review'
    successors:
      -
        id: action_notify_review_author
        condition: ''
conditions: {  }
gateways: {  }
actions:
  # The review node is the event object, injected as entity/source_entity by the
  # action's type:entity attribute. Empty recipients let the
  # consultation_review_assigned type's entity_author resolver target the
  # review's author; the deadline chains from the review's parent consultation
  # reference in the type template, so no load step or context key is needed.
  action_notify_review_author:
    label: 'Notify the review author'
    plugin: openintranet_notifications_create_and_enqueue
    configuration:
      notification_type: consultation_review_assigned
      recipients: ''
      context: {  }
    successors: {  }
