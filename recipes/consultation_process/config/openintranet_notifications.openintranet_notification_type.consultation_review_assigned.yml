langcode: en
status: true
dependencies:
  config:
    - field.field.node.consultation.field_consultation_deadline
    - node.type.consultation_review
id: consultation_review_assigned
label: 'Consultation review assigned'
description: 'Notifies a user that they have been assigned as a reviewer of a consultation.'
category: consultation
default_priority: normal
default_channels:
  - inbox
  - email_core
forced_channels: {  }
# Targets the author (owner) of the review entity passed in context.
recipient_resolvers:
  - id: entity_author
    configuration: {  }
template_map: {  }
template_renderer: token_text
subject_template: 'You have been added as reviewer of "[node:title]"'
body_template: "You have been added as a reviewer of \"[node:title]\".\n\nDeadline: [consultation:field_consultation_deadline]\n\n[node:url]"
summary_template: 'Review assigned: [node:title]'
delivery_policy: user_preferences
dedupe_window: 600
user_can_override: true
audit_retention_days: 90
enabled: true
